NOTES[201]=[["⭐ Key points",["Nouns are naming words. They name people, places, things, ideas or qualities, and often act as the subject or object of a sentence.","Common nouns are general names (boy, school, table). Proper nouns name a particular person, place, day, month or event and always begin with a capital letter (Abuja, Monday, Zuma Rock).","Concrete nouns can be seen, heard, touched, smelt or tasted (table, perfume, chocolate). Abstract nouns are qualities, actions or states we cannot touch (honesty, courage, sadness). Many come from adjectives or verbs: brave to bravery, fail to failure.","Countable nouns can be counted and have a singular and a plural (book, books; child, children). Singular countable nouns take a or an.","Uncountable nouns cannot be counted and have no plural (water, oil, advice, flour). Use quantifiers like some, much or a little, not a or an."]]];
NOTES[202]=[["⭐ Key points",["Collective nouns name a group as a single unit: a gang of thieves, a host of angels, a flock of sheep, a bale of cotton, a troupe of dancers, a tribe of natives, a galaxy of stars.","Compound nouns are two or more words joined into one noun with a new meaning.","Three forms: closed (bedroom, classroom, notebook), open (bus stop, post office, swimming pool) and hyphenated (check-in, passer-by, mother-in-law).","Nouns do jobs in a sentence: subject (the doer), direct object (receives the action), indirect object (to or for whom, e.g. We bought Grandma a present).","Also: object of a preposition (through the forest), predicate nominative (John is a student) and appositive (Mr. Ken, our Physics teacher, welcomed us)."]]];
NOTES[203]=[["⭐ Key points",["Pronouns are words used in place of a noun to avoid repeating it: I, you, me, she, he, it, we, they, him, her, us, them.","Subject pronouns do the action and come before the verb: I, you, he, she, it, we, they. Example: She is reading a book.","Object pronouns receive the action or follow a preposition: me, you, him, her, it, us, them. Example: The teacher taught him.","To replace nouns, match the person and number: John and Mary became he and her; Tunde and Aisha became they or them."]]];
NOTES[204]=[["⭐ Key points",["Singular pronouns refer to one: I, you, he, she, it, me, him, her. Plural pronouns refer to more than one: we, you, they, us, them.","Personal pronouns have three persons. First person is the speaker: I, we. Second person is the one spoken to: you. Third person is the one spoken about: he, she, it, they, them.","Pronouns change form by function (subject or object) and by number (singular or plural)."]]];
NOTES[205]=[["⭐ Key points",["Possessive pronouns show ownership: mine, yours, his, hers, its, ours, theirs. Example: The blue pen is hers.","Do not confuse them with possessive adjectives (my, your, her, our, their), which come before a noun. Match the pronoun to the owner, not the thing owned.","Reflexive pronouns end in -self or -selves: myself, yourself, himself, herself, itself, ourselves, yourselves, themselves. They turn the action back to the subject (She taught herself), add emphasis or show someone did it alone.","Demonstrative pronouns point to things: this (one, near), that (one, far), these (many, near), those (many, far). A demonstrative pronoun stands alone (This is sweet); before a noun it is an adjective (This book is sweet)."]]];
NOTES[206]=[["⭐ Key points",["Interrogative pronouns ask questions: who, whom, whose, which, what. Who is for people as subject, whom for people as object, whose for possession, which for a choice, what for things or ideas. End with a question mark.","Relative pronouns join sentences and give more information about a noun: who, whom, whose, which, that. Who is for people, which for things or animals, that for people or things, whose for possession.","Indefinite pronouns do not point to a specific person or thing: everyone, somebody, nobody, anything, each, none, few, many, some.","Types: universal (all, both, everyone), partitive (any, either, some) and negative (nobody, no one, nothing). Most are singular and take a singular verb (Everyone is present)."]]];
NOTES[207]=[["⭐ Key points",["A verb shows an action, an occurrence or a state of being. It is the only part of speech that shows time.","Simple present: base form (add -s or -es for he, she, it). Used for habits (I bath every day), general truths (The sun rises in the east), scheduled events and procedures.","Simple past: past form (usually -ed). Used for completed actions, past habits and a series of completed actions. Time words: yesterday, last week, in 2025.","Simple future: will or shall + base verb. Used for promises, predictions, requests and quick decisions (I will go to bed now)."]]];
NOTES[208]=[["⭐ Key points",["Present perfect: have or has + past participle. Used for actions that began in the past and continue, past actions with present results (I have eaten), unspecified past time and life experiences. Time words: always, never, just, yet, since, for.","Past perfect: had + past participle. Used for an action completed before another past action (I had cooked dinner before my parents came back). Often used with before, after, as soon as and by the time.","Future perfect: will have + past participle. Used for actions completed before a future time (By next month, we will have celebrated Christmas). Time words: by, before, by the time, by then."]]];

NOTES[301]=[["⭐ Key points",["Civil rule is a system of government in which a country is governed by civilian leaders chosen according to the constitutional and electoral system. Power is held by civilians, not the military.","Democracy is a system in which the people take part in choosing their leaders and in deciding how they are governed.","In a democracy: citizens can vote (subject to the law), leaders are chosen through elections, different parties compete, citizens can express opinions within the law, and government works under a constitution.","Features of civil rule: elections, political parties, a constitution, a legislature (the Senate and House of Representatives make up the National Assembly), separation of powers (Executive, Legislature, Judiciary), rule of law and political participation.","Civil rule: civilian leaders, chosen by elections, parties take part, elected legislatures work under the constitution. Military rule: military officers lead, they take over by force or appointment, parties may be restricted, legislatures may be dissolved and decrees are used."]]];

NOTES[302]=[["⭐ Key points",["Nigeria gained independence from Britain on 1 October 1960 and kept a parliamentary system based on the Westminster model. 1960 to 1966 is the First Republic.","Main offices: Governor-General (first represented the British monarch), Prime Minister (head of government), regional premiers and members of the legislatures.","In 1963 Nigeria became a republic. Dr. Nnamdi Azikiwe became the first President and Sir Abubakar Tafawa Balewa remained Prime Minister.","Major parties: NPC (Northern People's Congress, Balewa), NCNC (National Council of Nigeria and the Cameroons, Azikiwe) and Action Group (strong in the West, Chief Obafemi Awolowo).","Achievements: independent government, political institutions, regional governments, becoming a republic in 1963 and education and development programmes.","Challenges: party disagreements, regional rivalry, election disputes, ethnic tensions, the controversial 1964 federal election and the 1965 Western Region crisis. On 15 January 1966 a military coup ended the First Republic."]]];

hs(2,3,[["Which of these was an achievement of the First Republic?",["Nigeria became a republic in 1963","The military ruled the nation","The Second Republic began","Nigeria returned to civil rule in 1999"],0],["Which of these was a challenge of the First Republic?",["Regional rivalry","Debt relief","The 1979 Constitution","The 1999 transition"],0],["The controversial federal election of the First Republic was held in",["1964","1960","1970","1979"],0],["The Western Region election crisis took place in",["1965","1960","1963","1979"],0],["The coup that ended the First Republic took place on",["15 January 1966","31 December 1983","29 May 1999","1 October 1960"],0],["The 1966 coup began Nigeria's",["federal military rule","the Second Republic","the Third Republic","parliamentary rule"],0],["Which match is correct?",["1963 – Nigeria became a republic","1966 – Nigeria gained independence","1960 – First Republic ended","1960 – Nigeria became a republic"],0],["Which of these was one of the main offices in the First Republic?",["Prime Minister","Executive President","Vice President","Inspector General"],0],["Which is a difference between the First Republic and later civilian periods?",["It used a parliamentary system","It used a presidential system","It began in 1999","It lasted twenty-four years"],0],["Nigeria was sovereign at independence but kept the",["Westminster-style parliamentary system","a military-style presidential system","a one-party system of rule","a decree-based system of rule"],0]]);
NOTES[303]=[["⭐ Key points",["After 1966 there was military rule, broken by the Second Republic (1979 to 1983). The next civilian government began on 29 May 1999 and continues today.","Second Republic, 1979 to 1983: it followed military rule and a transition programme, and Nigeria moved from the parliamentary to the presidential system under the 1979 Constitution.","Alhaji Shehu Shagari became the first executive President in 1979. Parties, elections and the National Assembly operated.","Parties of the Second Republic: NPN, UPN, NPP, GNPP, PRP and NAP.","The Second Republic faced election disputes, corruption concerns and economic problems. On 31 December 1983 the military took over and it ended.","Importance of 1999: military rule ended, democratic institutions were restored, elections became the main way of choosing leaders, parties could operate and the National Assembly resumed its work."]]];

hs(3,3,[["On 31 December 1983, the",["military took control of government","Second Republic began","First Republic ended","Nigeria became independent"],0],["Which concern was raised during the Second Republic?",["corruption and economic management","colonial taxation","lack of political parties","loss of the constitution"],0],["Which of these is a significance of the 1999 transition?",["Military rule ended","The parliamentary system returned","Political parties were banned","Elections were abolished"],0],["After 1983, Nigeria experienced",["another period of military rule","a return of colonial rule","a long civilian rule","the First Republic again"],0],["After the 1999 return to civil rule, elections became",["the main method of choosing leaders","a rare way of choosing leaders","an illegal way of choosing leaders","an optional way of choosing leaders"],0],["Which was restored in 1999?",["democratic institutions","military decrees","colonial rule","one-party rule"],0],["After 1999, the National Assembly",["resumed democratic functions","was permanently closed","was replaced by a king","was run by the army"],0],["Which is the correct order of Nigeria's civilian periods?",["1960–1966, 1979–1983, 1999–present","1979–1983, 1960–1966, 1999–present","1999–present, 1960–1966, 1979–1983","1960–1966, 1999–present, 1979–1983"],0],["Between 1983 and 1999, Nigeria was mostly under",["military rule","civil rule","colonial rule","monarchy"],0],["Which statement is true about 1999?",["Nigeria began a sustained period of civilian rule","The Second Republic began that year","The First Republic ended that year","Nigeria gained independence that year"],0]]);
NOTES[304]=[["⭐ Key points",["Dr. Nnamdi Azikiwe (Zik of Africa): born 16 November 1904 in Zungeru. Nationalist, journalist and statesman, educated in the United States, linked to the NCNC. First indigenous Governor-General in 1960 and first President in 1963. Died 11 May 1996 in Enugu.","Sir Abubakar Tafawa Balewa: born December 1912 in Bauchi. A trained teacher and NPC leader. Nigeria's first and only Prime Minister, 1960 to 1966. He represented Nigeria abroad and was killed in the January 1966 coup.","Alhaji Shehu Shagari: born 25 February 1925 in Shagari, present-day Sokoto State. A teacher, member of parliament and minister. First executive President (1979 to 1983).","His government worked on education, housing, agriculture and infrastructure, but faced economic difficulties and corruption allegations. The military took over on 31 December 1983. He died on 28 December 2018."]]];

NOTES[305]=[["⭐ Key points",["Chief Olusegun Obasanjo: born 5 March 1937 in Abeokuta. Civilian President 1999 to 2007 after two elected terms. Focus: economic reforms, anti-corruption, infrastructure, democratic institutions, debt relief and international relations.","Umaru Musa Yar'Adua: born 16 August 1951 in Katsina State, a teacher and former governor of Katsina. President from 2007 until he died in office on 5 May 2010. Known for the Seven-Point Agenda, the Niger Delta peace process, electoral reform and the rule of law.","Goodluck Ebele Jonathan: born 20 November 1957 in Otuoke, Bayelsa State. He was Deputy Governor, Governor and Vice President. He became President after Yar'Adua died, was elected in 2011 and served until 2015.","The 2015 election was important because Jonathan conceded defeat and peacefully handed over power to Muhammadu Buhari.","Muhammadu Buhari: born 17 December 1942 in Daura, Katsina State. Military Head of State 1983 to 1985, then civilian President 2015 to 2023 (re-elected in 2019). He handed over to Bola Ahmed Tinubu on 29 May 2023. Tinubu is the current President."]]];

NOTES[306]=[["⭐ Key points",["The process of civil rule is the set of steps by which citizens choose civilian leaders and elected leaders form a government under the constitution.","Stages: formation of parties, registration of parties, selection of candidates, campaigns, voting, counting and declaration of results, and inauguration.","A political party is an organized group with similar political ideas and goals that seeks power by lawful democratic means. Parties present candidates, make programmes, mobilize supporters and give citizens choices.","Candidates are chosen through primaries, delegates' voting or other methods allowed by law, for offices like President, Governor, Senator, House of Representatives and State House of Assembly.","An election campaign is a period when parties and candidates explain their ideas and plans to win voters. They may hold rallies, give speeches, use approved posters, appear on radio, TV and social media, and visit communities.","Campaigns must be peaceful: respect other candidates, avoid violence, false information and hate speech, obey electoral laws, and discuss issues rather than attack people."]]];
hs(6,1,[["Candidates are usually presented to voters by",["political parties","the courts","the police","the schools"],0],["A political party is a group of people with",["similar political ideas and goals","different jobs and no plans","different languages and no goals","military ranks and uniforms"],0],["During a campaign, candidates may",["hold rallies","count votes","declare themselves winners","change the register"],0],["An election campaign is a period when candidates",["present their ideas to voters","count votes after the election","swear in the winners","register new voters"],0],["A campaign meeting gives candidates a chance to",["tell voters about their plans","count votes before election day","declare themselves winners","change the voters' register"],0],["A candidate promises to improve schools and hospitals. These promises are part of the candidate's",["manifesto","family history","voter's card","ballot box"],0],["Political parties help citizens by giving them",["political choices","free food","military training","a new constitution"],0],["A party chooses its candidates before the",["election","independence","inauguration","census"],0],["One way parties choose candidates is through",["primaries","decrees","coups","lotteries"],0],["Campaign materials like posters should be",["approved","torn","hidden","stolen"],0]]);
hs(6,2,[["Two groups disagree during a campaign. What should they do?",["discuss their views peacefully","fight in the street","damage each other's posters","stop others from voting"],0],["Which is a responsible campaign behaviour?",["respecting other candidates","spreading false information","using hate speech","attacking opponents"],0],["Which behaviour should be avoided during campaigns?",["violence","rallies","speeches","posters"],0],["Candidates should discuss ____ rather than attack people.",["issues and policies","rumours about rivals","tribes and families","private lives"],0],["Which of these is NOT a political party?",["INEC","NPC","NCNC","Action Group"],0],["The first stage in the process of civil rule is the formation of",["political parties","ballot boxes","polling units","constitutions"],0],["Parties can select candidates for the position of",["Governor","Chief Justice","army general","police inspector"],0],["Parties can select candidates for the position of",["Senator","judge","army chief","registrar"],0],["Political parties must meet legal requirements for",["registration and operation","military training only","defeating rivals by force","collecting taxes"],0],["Which activity do political parties do?",["develop programmes and policies","count votes officially","announce INEC results","swear in the President"],0]]);
hs(6,3,[["Which of these is NOT done during a campaign?",["Counting votes","Explaining plans","Giving speeches","Visiting communities"],0],["Which stage comes after selection of candidates?",["election campaigns","inauguration","counting of votes","declaration of results"],0],["Which order is correct?",["Formation of parties, selection of candidates, election campaigns","Election campaigns, formation of parties, selection of candidates","Selection of candidates, formation of parties, campaigns","Campaigns, selection of candidates, formation of parties"],0],["Which is an importance of political parties?",["They educate voters","They count the final votes","They write the constitution","They appoint judges"],0],["Political parties help connect citizens with",["government","the military","foreign rulers","tax offices"],0],["Which should supporters avoid?",["spreading false information","respecting the law","peaceful campaigning","discussing policies"],0],["Responsible campaigns allow other parties to",["campaign peacefully","be banned","be silenced","be attacked"],0],["The last stage in the process of civil rule listed in the note is",["inauguration of successful candidates","selection of candidates","formation of political parties","registration of parties"],0],["A party's manifesto states its",["plans and promises","election results","voters' names","court cases"],0],["Which is a way political parties encourage participation?",["Mobilizing supporters","Closing polling units","Suspending the constitution","Dissolving the legislature"],0]]);
NOTES[307]=[["⭐ Key points",["An election is a formal process through which citizens choose people to represent them. INEC (Independent National Electoral Commission) organizes federal and state elections.","Steps: voter registration, party activities, campaigns, voting, counting, collation of results and declaration of the winner. A voter must not register more than once.","On election day voters go to their polling units, verify their identity and vote. Nigeria uses the secret ballot, so a voter's choice stays private. Votes are counted and recorded, then results are collated and the winner is declared.","Inauguration is the ceremony where an elected leader takes the oath of office and begins a term, promising to follow the Constitution and laws. It shows the peaceful transfer of authority.","Citizen duties: register, get a voter card, learn about candidates, vote freely, avoid selling votes and violence, respect officials, avoid false information, and accept legitimate results while challenging disputes lawfully.","Electoral malpractice: multiple voting, ballot box snatching, intimidation, falsifying results, destroying materials, voting in another's name and violence. It reduces trust, causes tension and damages democracy."]]];
hs(7,1,[["INEC stands for",["Independent National Electoral Commission","Independent National Education Council","International Nigerian Election Committee","Internal National Election Council"],0],["An election is a formal process through which citizens",["choose their leaders","are forced to pay tax","are ruled by soldiers","write laws"],0],["The first major step in choosing leaders through an election is often",["voter registration","swearing in","announcing results","handing over power"],0],["A secret ballot means that",["a voter's choice is private","everyone must announce their choice","voters vote for the same person","officials choose for voters"],0],["At a polling unit, a voter should follow the instructions of",["election officials","party supporters","other voters only","market leaders"],0],["On election day, voters go to their assigned",["polling units","police stations","law courts","government houses"],0],["A fair election gives eligible voters the chance to",["choose their leaders freely","vote more than once","sell their ballot papers","be forced to support a party"],0],["After voting ends, the next step is",["counting of votes","inauguration","voter registration","campaigns"],0],["Why should voters avoid selling their votes?",["It can lead to leaders being chosen unfairly","It makes voting faster","It improves the ballot paper","It gives every person two votes"],0],["Multiple voting means",["voting more than once","voting secretly","registering to vote","joining a party"],0]]);
hs(7,2,[["A person who wants to vote in an election in Nigeria must be",["a registered voter who meets the legal requirements","a visitor from another country","below voting age","a candidate for office"],0],["After the votes have been counted, the results are",["recorded and announced through the proper process","hidden from everyone forever","changed to please a candidate","decided by the crowd"],0],["If an election official asks a voter to follow the correct voting procedure, the voter should",["cooperate and follow the lawful instructions","argue and cause a disturbance","leave the polling unit immediately","mark other people's ballot papers"],0],["Results from polling units are brought together in a process called",["collation","registration","inauguration","campaigning"],0],["A voter should not register",["more than once","with correct details","as an eligible citizen","with INEC"],0],["The winner of an election is",["the candidate who meets the legal requirements","the candidate with the loudest supporters","chosen by the crowd","chosen by the army"],0],["Which step comes just before declaration of the winner?",["collation of results","campaigns","voter registration","inauguration"],0],["Inauguration is the ceremony where an elected leader",["begins a term","loses an election","casts a ballot","joins a party"],0],["The oath taken by an elected leader at the start of office is part of the",["swearing-in ceremony/ Inauguration","campaign","voter registration","Political party nomination"],0],["A candidate who believes an election result is wrong should",["follow the legal process to challenge it","attack the electoral office","threaten the winner","destroy the result sheets"],0]]);
hs(7,3,[["When an elected government completes its term and another elected government takes over peacefully, this is called",["a handing over","a coup","a civil war","a campaign rally"],0],["Ballot box snatching is an example of",["electoral malpractice","voter registration","a campaign","secret ballot"],0],["Which is an example of electoral malpractice?",["voting in another person's name","obtaining a voter card","learning about candidates","respecting officials"],0],["Which is an effect of electoral malpractice?",["It reduces public trust","It strengthens democracy","It produces genuine leaders","It ends tension"],0],["The oath of office is a formal promise to perform duties according to the",["Constitution and laws","party manifesto","campaign promises","army orders"],0],["Which is a responsibility of citizens in elections?",["Respecting election officials","Snatching ballot boxes","Selling their votes","Spreading false information"],0],["Which is NOT a responsibility of citizens in elections?",["selling their votes","registering to vote","learning about candidates","respecting election officials"],0],["Electoral malpractice can lead to",["political tension","fair results","public trust","peaceful transfer of power"],0],["Inauguration symbolizes the",["peaceful transfer of power","end of democracy","start of a coup","banning of parties"],0],["Falsification of election results is an example of",["electoral malpractice","a responsible campaign","voter education","collation"],0]]);

NOTES[1]=[["🏡 What is a habitat?",["A <b>habitat</b> is a place where living things (plants and animals) live.","They depend on it for <b>food, water, air and shelter</b>."]],
["🌍 Types of habitat",["<b>Terrestrial</b> habitats are on land: desert, grassland, forest, mountain, valley.","<b>Aquatic</b> habitats are in water: pond, river, lake, sea, ocean.","<b>Arboreal (aerial)</b> habitat is the sky or tree top. It is classified as a <b>terrestrial</b> habitat."]],
["🌴 Plants and animals",["<b>Terrestrial:</b> cactus, mango, palm, coconut, aloe vera; humans, lion, giraffe, camel, birds.","<b>Aquatic:</b> water hyacinth, water lily, water lettuce, lotus, duckweed; fishes, octopus, jellyfish, eel, whale."]],
["🔬 Parts of a habitat",["<b>Biotic</b> = living things (plants, animals, micro-organisms).","<b>Abiotic</b> = non-living things (air, water, sunlight, soil, temperature)."]],
["💪 What is adaptation?",["<b>Adaptation</b> is the ability of living things to adjust to their habitat so they can survive.","It can be a change in the <b>body</b>, in <b>behaviour</b> or in <b>location</b>."]],
["🌵 Adaptation on land",["<b>Cactus</b> stores water in its stem.","<b>Tree</b> roots stretch far into the ground to absorb water.","<b>Camels</b> store water in their body.","<b>Chameleons</b> change colour so predators cannot see them.","<b>Polar bears</b> have fur that protects them from cold."]],
["🐟 Adaptation in water",["<b>Aquatic plants</b> have short, small roots that hold them in place.","<b>Fish</b> have a streamlined shape and gills for breathing.","<b>Crabs</b> have paddled back legs; <b>frogs</b> have webbed back feet for swimming."]]];

NOTES[2]=[["⭐ Key points",["Interdependency means living things depend on each other and on the environment to survive. They need food, water and shelter.","Symbiosis: two different species both benefit. The bee gets nectar and the flower gets pollinated.","Competition: living things use the same resources, like a lion and a tiger hunting the same prey. The one with better adaptations may win.","Plants depend on animals for carbon dioxide, for pollination and seed dispersal, and for minerals when animals excrete or die.","Animals depend on plants for food, shelter, herbs and medicine, and oxygen to breathe."]]];
sci(2,1,[["What is interdependency?",["The process where organisms depend on each other and the environment for survival","The total destruction of natural habitats","A relationship where only one organism survives","The movement of microbes through air"],0],["In the symbiotic relationship between a bee and a flower, what does the flower obtain?",["Pollination","Nectar for food","Protection from cold","Shelter"],0],["Why do plants depend on animals for photosynthesis?",["To obtain carbon dioxide","To obtain oxygen","To obtain shade","To obtain water vapor"],0],["What essential gas do animals absorb from plants during breathing?",["Oxygen","Carbon dioxide","Nitrogen","Hydrogen"],0],["Which gas released by plants during food-making is made available to aquatic animals?",["Oxygen","Carbon dioxide","Nitrogen","Methane"],0],["Living things need which components of a habitat?",["Both biotic and abiotic components","Only biotic components","Only abiotic components","No components at all"],0],["Which pair are likely to compete?",["Two goats feeding on the same small patch of grass","A bee and a flower","A bird and the tree it lives in","A human and the herbs he plants"],0],["A relationship where both different species benefit is called:",["Symbiosis","Competition","Predation","Decomposition"],0],["Who depends on the environment for food, water and shelter?",["All living things","Only animals","Only plants","Only humans"],0],["Plants need animals for:",["Seed dispersal and pollination","Making sunlight","Giving out oxygen","Growing roots"],0]]);
sci(2,2,[["What do living things depend on their environment to supply?",["Food, water, and shelter","Money and gold","Artificial light only","Chemical fertilizers"],0],["What is competition in an ecosystem?",["A relationship between living things depending on the same resources","A relationship where both organisms benefit equally","The release of oxygen into the air","The absorption of mineral nutrients by soil"],0],["What do animals provide to plants upon excretion or death?",["Minerals and nutrients","Carbon monoxide","Direct sunlight","Oxygen gas"],0],["How do some animals depend on plants for protection and living spaces?",["Plants provide them with shelter","Plants increase water temperature","Plants digest dead matter","Plants act as predators"],0],["In a forest, what happens to the carbon dioxide given off by decaying leaves and animals?",["It is absorbed by plants","It turns into soil minerals directly","It disappears completely","It stops photosynthesis"],0],["In the relationship between a bee and a flower, what does the bee get?",["Nectar","Shelter","Seeds","Water"],0],["Which gas do plants take from animals for photosynthesis?",["Carbon dioxide","Oxygen","Nitrogen","Hydrogen"],0],["Which organism is more likely to win in competition?",["The one with better adaptations","The one that is smaller","The one that is slower","The one that is asleep"],0],["A dog gets food and shelter from its owner, and the owner gets company and protection. This is:",["Symbiosis","Competition","Decomposition","Adaptation"],0],["Which is an example of a plant depending on an animal?",["A flower depends on a bee for pollination","A cow eats grass","A bird nests in a tree","A man uses herbs"],0]]);
sci(2,3,[["What is symbiosis?",["A relationship between different species where both benefit from each other","A conflict between two animals for the same prey","The breakdown of dead matter by bacteria","A relationship where one organism kills another"],0],["Which of the following represents a competitive relationship?",["A lion and a tiger hunting the same prey","A bee collecting nectar from a flower","A bird living inside a tree hole","A plant absorbing carbon dioxide"],0],["Which process involves animals helping plants produce new seeds across areas?",["Pollination and seed dispersal","Photosynthesis","Respiration","Evaporation"],0],["What important product do humans derive from plants for treating illnesses?",["Herbs and medicine","Synthetic plastics","Soil minerals","Abiotic nutrients"],0],["When an organism with better adaptations competes with another for limited resources, what is the likely outcome?",["The organism with better adaptations wins out","Both organisms die immediately","They change into producers","They form a symbiotic union"],0],["Pollination is the transfer of:",["Pollen from one flower to another","Water from roots to leaves","Seeds into the soil","Food to the bee"],0],["What do animals depend on plants for?",["Food","Metals","Plastics","Rocks"],0],["What do plants absorb from the bodies of dead animals?",["Minerals and nutrients","Oxygen","Sunlight","Carbon dioxide only"],0],["Which statement about interdependency is true?",["Organisms depend on each other and on the environment","Organisms can live completely alone","Only animals depend on plants","Plants do not need animals"],0],["Which is an example of an animal depending on a plant for shelter?",["A bird living in a tree","A bee carrying pollen","A lion hunting","Fungi decomposing a log"],0]]);
NOTES[3]=[["⭐ Key points",["A food chain is a straight path showing how energy flows from one organism to another. A food web is many food chains joined together.","Four parts of a food chain: the Sun, producers, consumers and decomposers.","Producers (autotrophs) make their own food by photosynthesis. Consumers (heterotrophs) depend on plants for food. Decomposers (fungi, bacteria) break down dead matter into nutrients for the soil.","Trophic levels: 1st producers, 2nd primary consumers, 3rd secondary consumers, 4th tertiary consumers or decomposers.","Herbivores eat only plants (cow, rabbit, deer, goat). Carnivores eat only animals (lion, tiger, wolf). Omnivores eat both (humans, pigs, bears).","A predator hunts and kills other animals for food. A prey is the animal that is caught and eaten."]]];

sci(3,3,[["What is the primary source of energy that plants use for photosynthesis in a food chain?",["The sun","The moon","Decomposers","Soil minerals"],0],["What are consumers also known as?",["Heterotrophs","Autotrophs","Decomposers","Producers"],0],["Which trophic level is occupied by producers in a food chain?",["First trophic level","Second trophic level","Third trophic level","Fourth trophic level"],0],["Which of the following animals is an omnivore?",["Human","Lion","Cow","Tiger"],0],["In the food chain: Grass -> Rabbit -> Fox -> Mushroom, which organism represents the secondary consumer?",["Fox","Grass","Rabbit","Mushroom"],0],["Which trophic level do primary consumers occupy?",["Second","First","Third","Fourth"],0],["Carnivores feed on:",["Only animals","Only plants","Plants and animals","Only dead matter"],0],["A food web is made up of many connected:",["Food chains","Decomposers only","Producers only","Habitats"],0],["What happens to nutrients when decomposers break down dead matter?",["They return to the soil for producers","They are lost forever","They become sunlight","They turn into predators"],0],["What does trophic level mean?",["The position of an organism in a food chain","The type of soil in a habitat","The number of animals in a forest","A kind of habitat"],0]]);
NOTES[4]=[["⭐ Key points",["Micro-organisms are too small to see with the eyes. We need a microscope. Their study is called microbiology.","The five groups: bacteria, fungi, viruses, algae and protozoa.","Bacteria: spherical, rod-like or curved. Examples: salmonella, streptococcus, vibrio, E. coli. Fungi: mushrooms, molds and yeasts. They feed on dead plants and animals.","Viruses cause cold, flu, measles, HIV and COVID-19. They feed on a living host. Fever helps the body fight them and vaccines prevent them.","Algae live on moist, damp surfaces, make food by photosynthesis and give out oxygen. Protozoa love water. Examples: amoeba, paramecium, euglena. Some are parasites.","Micro-organisms are the smallest organisms, are found everywhere and prefer moist, damp places."]]];
sci(4,1,[["What are micro-organisms?",["Organisms too small to be seen with the naked eye","Large animals seen in forests","Plants growing only on mountains","Non-living components of soil"],0],["Which of the following lists the five main groups of micro-organisms?",["Bacteria, Fungi, Virus, Algae, Protozoa","Plants, Animals, Fish, Birds, Insects","Solids, Liquids, Gases, Solutions, Mixtures","Producers, Consumers, Herbivores, Carnivores, Omnivores"],0],["How do fungi obtain their nutrients?",["By decomposing dead plants and animals","By manufacturing food via photosynthesis","By absorbing sunlight directly","By hunting live prey"],0],["What medical preparation made from dead or weakened microbes is used to prevent viral diseases?",["Vaccines","Antibiotics","Disinfectants","Nutrient solutions"],0],["Which micro-organism group loves water and commonly spreads through contaminated water?",["Protozoa","Fungi","Yeasts","Molds"],0],["Micro-organisms can be:",["Unicellular or multicellular","Only large","Only found in water","Only plants"],0],["Which of these is an example of algae?",["Green algae","E. coli","Amoeba","Yeast"],0],["Micro-organisms prefer which type of environment?",["Moist, damp and aquatic","Hot and dry","Extremely cold","Bright desert sun"],0],["Bacteria can exist as:",["Both autotrophs and heterotrophs","Only autotrophs","Only parasites","Only decomposers of rocks"],0],["Which statement about viruses is true?",["They are neither autotrophs nor heterotrophs","They make food by photosynthesis","They are large animals","They are multicellular plants"],0]]);

NOTES[5]=[["⭐ Key points",["Transmission is the spreading of micro-organisms. Ways: touch, food, air (coughs and sneezes), water, insects (female Anopheles mosquito spreads malaria) and fomites (towels, bedding, toys).","Pathogens are disease-causing microbes. Vectors carry microbes from one place to another.","Microbes grow well with wetness, warmth (temperature), neutral solutions like water, oxygen and carbon dioxide, and light.","Helpful: decompose waste and feed the soil, bacteria make milk products like yoghurt and cheese, yeast is used for baking and wine, and they make medicines, antibiotics and vaccines. Algae make much of Earth's oxygen.","Harmful: they make us sick, spoil food, grow on walls, carpets and books (causing allergies) and damage plants."]]];
sci(5,1,[["What is the process of micro-organisms spreading from one place to another called?",["Transmission","Adaptation","Photosynthesis","Distillation"],0],["What are non-living objects like bedding, towels, and toys that carry and spread microbes called?",["Fomites","Vectors","Pathogens","Autotrophs"],0],["What type of solution pH best favors the growth of most micro-organisms?",["Neutral solution (like water)","Highly acidic","Extremely basic","Concentrated acid"],0],["What important role do micro-organisms play in maintaining soil fertility?",["They decompose organic matter and return nutrients to soil","They dry up soil moisture","They block plant roots","They reflect sunlight away"],0],["Which organisms carry disease-causing microbes from one source to another without necessarily getting sick themselves?",["Vectors","Producers","Autotrophs","Solvents"],0],["Which of these is a means of transmission of micro-organisms?",["Touch","Sleeping","Photosynthesis","Evaporation"],0],["Which pair promote the growth of micro-organisms?",["Wetness and temperature","Dryness and acid","Freezing and darkness","Dust and wind"],0],["Which is a harmful effect of micro-organisms?",["They can attack plants and damage farm produce","They make yoghurt","They return nutrients to the soil","They make bread rise"],0],["Mold and algae growing on walls, carpets and books can trigger:",["Allergies","Rain","Pollination","Photosynthesis"],0],["Water is an example of what kind of solution?",["Neutral","Acidic","Basic","Saturated"],0]]);

NOTES[6]=[["⭐ Key points",["Material change is a transformation of a material by a process. It can be reversible or irreversible.","Reversible (physical): can be undone, no new substance forms. Examples: melting wax, freezing water, dissolving salt, inflating a balloon.","Irreversible (chemical): cannot be undone, a new substance forms. Examples: baking bread, burning paper, rusting iron, boiling an egg.","A mixture is two or more substances joined without a chemical change. Heterogeneous: not mixed evenly (oil and water). Homogeneous: looks the same all through (sugar and water).","A solution is a solute dissolved in a solvent. Solute dissolves; solvent does the dissolving. Saturated means the most solute is dissolved.","Separating: filtration for solid and liquid, sorting by hand, evaporation by heating, distillation for liquids. Solubility depends on temperature, pressure, agitation and particle size."]]];

sci(6,2,[["What is a reversible change?",["A change that can be reversed or undone","A change that cannot be undone","A change that always produces a new substance","A chemical reaction"],0],["What is an irreversible change?",["A change that cannot be reversed or undone","A change that can be easily undone","A change where no new substance forms","A physical change"],0],["What is a heterogeneous mixture?",["A mixture in which substances do not mix perfectly and can be individually identified","A mixture where components mix perfectly and look uniform","A liquid solution of salt and water","A gas dissolved in liquid"],0],["What is a solute defined as?",["The substance that dissolves in a solvent","The liquid that does the dissolving","The insoluble solid left on filter paper","The gas given off during heating"],0],["What is a saturated solution?",["A solution that has dissolved the maximum amount of solute it is capable of dissolving","A solution containing less solute than it can dissolve","A mixture where solute settles at the bottom instantly","A liquid containing no solute"],0],["Which of these is an irreversible change?",["Burning of wood","Freezing water","Melting wax","Inflating a balloon"],0],["Which of these is a chemical change?",["Boiling an egg","Stretching a rubber band","Melting wax","Dissolving salt in water"],0],["A solution is a homogeneous mixture of a solute dissolved in a:",["Solvent","Sieve","Solid","Residue"],0],["Evaporation separates a mixture by:",["Heating the mixture","Shaking it","Picking by hand","Using a magnet"],0],["Which of these factors affects solubility?",["Particle size","Colour of the beaker","Shape of the table","Time of day"],0]]);

function fmt(ts){var d=new Date(ts);return d.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"})+" · "+d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"})}
function draw(){
 var h="",a=document.getElementById("app");
 if(V.p=="welcome"){
  h='<div class="card hero"><div class="big">🎒</div><div style="font-size:20px;color:#2f8cff">Welcome aboard, super learner!</div><h1>Basic 6<br>Fun Tour</h1><div class="tag">Play. Learn. Level up. Become a champion! 🏆</div><p style="font-size:20px">What is your name, explorer?</p><input id="nm" maxlength="30" placeholder="Type your name here" value="'+esc(S.name)+'" onkeydown="if(event.key==\'Enter\')start()"><div><button class="btn gr" onclick="start()">Start the Tour 🚀</button></div></div>';
 }else if(V.p=="fame"){
  h=famePage();
 }else if(V.p=="wall"){
  h=bar()+'<div class="card"><h2>Pick your adventure, '+esc(S.name)+'! 🌟</h2><div class="grid">'+SUBJECTS.map(function(s){return '<button class="tile'+(s.on?'':' soon')+'" style="background:'+s.color+'" onclick="'+(s.on?"go('stages',{sub:'"+s.id+"'})":"soon()")+'"><span class="e">'+s.emoji+'</span><span class="n">'+s.name+'</span><span class="s">'+s.sub+(s.on?'':' · coming soon')+'</span></button>'}).join("")+'</div></div>';
 }else if(V.p=="stages"){
  var fam=V.sub,sc=fam!="m",off=fam=="h"?300:fam=="g"?200:fam=="s"?100:0;h=bar("go('wall')")+'<div class="card"><h2>'+({m:'🧮 Mathonic',s:'🔬 Sci-Spark',g:'🪄 Word Wizard',h:'📜 Hi-Story'}[fam])+' · Choose a Stage</h2>'+(fam=="h"?HSTAGES:fam=="g"?GSTAGES:sc?SSTAGES:STAGES).map(function(t,i){var n=off+i+1;return '<button class="stage" onclick="'+(sc&&!stOpen(n)?'stLock()':'go(\''+(sc?'mode':'levels')+'\',{s:'+n+'})')+'"><i>'+(sc&&!stOpen(n)?'🔒':i+1)+'</i><span>Stage '+(i+1)+' · '+t+'</span></button>'}).join("")+'</div>';
 }else if(V.p=="mode"){
  h=bar("go('stages',{sub:'"+(V.s>300?"h":V.s>200?"g":"s")+"'})")+'<div class="card hero"><div class="big">'+(V.s>300?"📜":V.s>200?"🪄":"🔬")+'</div><h2>Stage '+(V.s%100)+' · '+SN(V.s)+'</h2><p style="font-size:20px">What would you like to do?</p><button class="btn alt" onclick="go(\'read\',{s:'+V.s+'})">📖 KEYPOINT</button><button class="btn gr" onclick="go(\'levels\',{s:'+V.s+'})">🎮 PLAY</button></div>';
 }else if(V.p=="read"){
  var n=V.s%100,nt=NOTES[V.s>200?V.s:n];h=bar("go('mode',{s:"+V.s+"})")+'<div class="card"><h2>📖 '+SN(V.s)+'</h2>'+(V.s>300?LEG+qf(V.s):'')+(nt?nt.map(function(c){return '<div class="note"><b style="font-size:22px">'+c[0]+'</b><ul style="margin:8px 0;padding-left:22px;font-size:19px">'+c[1].map(function(p){return '<li style="margin:6px 0">'+(V.s>300?hl(p):p)+'</li>'}).join("")+'</ul></div>'}).join(""):'<div class="note">Notes for this stage are coming soon.</div>')+'<button class="btn gr" onclick="go(\'levels\',{s:'+V.s+'})">🎮 PLAY</button></div>';
 }else if(V.p=="levels"){
  var s=V.s;
  var sc=s>100;h=bar(sc?"go('mode',{s:"+s+"})":"go('stages',{sub:'m'})")+'<div class="card"><h2>Stage '+(s%100)+' · '+SN(s)+'</h2><p>Pick a level and climb to the top! 🧗</p><div class="lv">'+nl(s).map(function(l){var o=isOpen(s,l);return '<button style="background:'+(o?LCOL[l-1]:'#a9a3c4')+'" onclick="play('+s+','+l+')">Level<b>'+(l+(hasStar(S.hist,s,l)?'⭐':''))+'</b>'+(o?(s>300?HLN:s>200?GCAT[s%100-1]:s>100?SLN:(MLN[s]||LNAME))[l-1]:'Sealed')+'</button>'}).join("")+'</div><button class="btn alt" style="width:100%" onclick="go(\'history\',{s:'+s+'})">📊 History of Performance</button></div>';
 }else if(V.p=="nogame"){
  h=bar("go('levels',{s:"+V.s+"})")+'<div class="card hero"><div class="big">🛠️</div><h2>Stage '+(V.s%100)+' · Level '+V.l+'</h2><div class="note">Questions for this level are on the way. Check back soon!</div></div>';
 }else if(V.p=="play"){
  var q=run.q[run.i];
  h=bar()+'<div class="card"><div style="display:flex;justify-content:space-between"><span>Stage '+(run.s%100)+' · Level '+run.l+'</span><span>Question '+(run.i+1)+' of '+run.q.length+'</span></div><div class="bar"><div style="width:'+(run.i/run.q.length*100)+'%"></div></div><div class="qbox">'+esc(q.q)+'</div>'+(q.svg||'')+'<div style="text-align:center">'+(q.o?q.o.map(function(o){return '<button class="btn alt" onclick="pick(this)">'+esc(o)+'</button>'}).join(""):inp(q))+'</div></div>';
 }else if(V.p=="history"){
  var list=[];
  nl(V.s).forEach(function(l){(S.hist[V.s+"-"+l]||[]).forEach(function(r,i){list.push({r:r,l:l,i:i})})});
  list.sort(function(x,y){return y.r.t-x.r.t});
  h=bar("go('levels',{s:"+V.s+"})")+'<div class="card"><h2>📊 Stage '+(V.s%100)+' · History</h2>'+(list.length?list.map(function(o){return '<div class="row"><span>Level '+o.l+'<br><small>'+fmt(o.r.t)+'</small></span><button class="pill'+(o.r.score/o.r.total<.5?' lo':'')+'" onclick="go(\'review\',{s:'+V.s+',l:'+o.l+',i:'+o.i+'})">'+o.r.score+' / '+o.r.total+'</button></div>'}).join(""):'<div class="note">No attempts yet. Play a level and your scores will appear here! 🎯</div>')+'</div>';
 }else if(V.p=="review"){
  var r=S.hist[V.s+"-"+V.l][V.i];
  h=bar("go('history',{s:"+V.s+"})")+'<div class="card"><h2>Level '+V.l+' · '+r.score+' / '+r.total+'</h2><div class="note">'+fmt(r.t)+'</div>'+r.items.map(function(it,n){return it.ok?'<div class="rv ok">✅ '+(n+1)+'. '+esc(it.q)+(it.svg||'')+'<br>Correct answer: '+esc(it.a)+'</div>':'<div class="rv bad">❌ '+(n+1)+'. '+esc(it.q)+(it.svg||'')+'<br>Your answer: '+esc(it.u||"(blank)")+'<div class="fix">✔ Correction: '+esc(it.a)+'</div></div>'}).join("")+'</div>';
 }else if(V.p=="result"){
  var p=V.sc/V.tot;
  h=bar()+'<div class="card hero"><div class="big">'+(p>=.8?'🏆':p>=.5?'🌟':'💪')+'</div><h2>'+V.sc+' out of '+V.tot+'</h2><p style="font-size:20px">'+(p>=.8?'Brilliant work!':p>=.5?'Good job! Try again to beat it.':'Keep going, you will get it!')+'</p>'+(V.first?'<div class="note">⭐ New star earned for this level!</div>':V.sc>=need(V.tot)?'<div class="note">✅ Excellent again! A star is earned only the first time.</div>':'<div class="note">Score at least '+need(V.tot)+' out of '+V.tot+' to earn the star ⭐.</div>')+(V.tro?'<div class="note">🏆 Trophy earned! Excellent in every level of this stage!</div>':'')+'<button class="btn gr" onclick="play('+V.s+','+V.l+')">Play again 🔁</button><button class="btn alt" onclick="go(\'review\',{s:'+V.s+',l:'+V.l+',i:'+(S.hist[V.s+'-'+V.l].length-1)+'})">See corrections</button></div>';
 }
 a.innerHTML=CAP+h;window.scrollTo(0,0);
 var f=document.getElementById("nm")||document.getElementById("ans")||document.querySelector(".bx");if(f)f.focus();
}
function start(){var n=document.getElementById("nm").value.trim();if(!n){document.getElementById("nm").style.borderColor="#ff4f4f";return}S.name=n;S.disp=S.disp||{};S.disp[n.toLowerCase()]=n;S.all=S.all||{};S.hist=S.all[n.toLowerCase()]=S.all[n.toLowerCase()]||{};save();go("wall")}
function soon(){alert("This adventure is coming soon! 🚧")}
function play(s,l){if(!isOpen(s,l)){alert("🔒 Sealed! Get an excellent score in Level "+(l-1)+" to open this level.");return}var g=GEN[s+"-"+l];if(!g){go("nogame",{s:s,l:l});return}run={s:s,l:l,q:g(),i:0,items:[]};go("play")}
function pick(b){submit(b.textContent)}
function submit(v){
 var q=run.q[run.i],u,arr;if(q.k=="seq"){arr=[].map.call(document.querySelectorAll(".bx"),function(e){return e.value.trim()});u=arr.join(" , ")}else u=(v!==undefined?v:document.getElementById("ans").value).trim();
 var ok=chk(q,q.k=="seq"?arr:u);
 run.items.push({q:q.q,a:q.a,u:u,ok:ok,svg:q.svg||""});run.i++;
 if(run.i<run.q.length){go("play");return}
 var sc=run.items.filter(function(x){return x.ok}).length,key=run.s+"-"+run.l,tot=run.items.length,had=hasStar(S.hist,run.s,run.l),trB=stat(S.hist).tr;
 (S.hist[key]=S.hist[key]||[]).push({t:Date.now(),score:sc,total:tot,items:run.items});save();
 go("result",{s:run.s,l:run.l,sc:sc,tot:tot,first:!had&&sc>=need(tot),tro:stat(S.hist).tr>trB});
}
if(S.name)V.p="wall";draw();
</script></body></html>
